DS.DSSpecificheAllestimenti.Class=net.project.dataset.DBDataSet
DS.DSSpecificheAllestimenti.Row=project.db.PjDBRow
DS.DSSpecificheAllestimenti.Query=\
SELECT \
 SA.ID_SPECIFICA \
 ,SA.ID_FAMIGLIA \
 ,AL.ID_ALLESTIMENTO \
 ,AL.ORDINE \
 ,ALS.CODICE AS CODICE_ALLESTIMENTO \
 ,ALS.DESCRIZIONE AS TIPOLOGIA_ALLESTIMENTO \
 ,AL.CARATTERISTICA AS CARATTERISTICA \
 ,CASE WHEN AL.FL_MATERIALE=TRUE THEN MAT.DESCRIZIONE ELSE SA.DESCRIZIONE END AS DESCRIZIONE\
 ,AL.FL_MATERIALE \
 ,SA.ID_MATERIALE \
 ,MAT.DESCRIZIONE AS DESCRIZIONE_MATERIALE \
 ,MAT.CODICE_SAP \
FROM ALLESTIMENTI AS AL \
LEFT OUTER JOIN SPECIFICHE_ALLESTIMENTO AS SA \
ON AL.ID_ALLESTIMENTO = SA.ID_ALLESTIMENTO AND ID_FAMIGLIA=#ID_FAMIGLIA# \
LEFT OUTER JOIN PARAMETRI AS ALS \
ON ALS.CODICE = AL.CODICE_ALLESTIMENTO AND ALS.DOMINIO='ALS' \
LEFT OUTER JOIN MATERIALI AS MAT \
ON SA.ID_MATERIALE = MAT.ID_MATERIALE \
#WHERECONDITION# ORDER BY CODICE_ALLESTIMENTO,ORDINE

