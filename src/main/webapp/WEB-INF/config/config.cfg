DS.DSApprovatoriRichiesta.Class=net.project.dataset.DBDataSet
DS.DSApprovatoriRichiesta.Row=project.db.PjDBRow
DS.DSApprovatoriRichiesta.Query=\
SELECT \
	AR.ID_APPROVATORE \
	,TR.DESCRIZIONE \
	,AR.ID_AZIENDA \
	,AZ.RAGSOC \
	,AR.ID_DIREZIONE \
	,DI.NOME_DIREZIONE \
	,AR.ID_RISORSA \
	,RI.NOME+' '+RI.COGNOME AS NOMINATIVO \
	,AZ.RAGSOC + ' - '+RI.NOME+' '+RI.COGNOME AS AZIENDA_NOMINATIVO \
	,AR.LIVELLO_APPR \
FROM APPROVATORI_RICHIESTE AS AR \
INNER JOIN TIPO_RICHIESTE_AZIENDA AS TRA \
ON TRA.ID_TIPO_RICHIESTA =  AR.ID_TIPO_RICHIESTA AND TRA.ID_AZIENDA = AR.ID_AZIENDA \
INNER JOIN TIPI_RICHIESTA AS TR \
ON TR.ID_TIPO_RICHIESTA =  AR.ID_TIPO_RICHIESTA \
INNER JOIN AZIENDE AS AZ \
ON AZ.ID_AZIENDA=AR.ID_AZIENDA \
INNER JOIN DIREZIONI AS DI \
ON DI.ID_DIREZIONE=AR.ID_DIREZIONE \
INNER JOIN RISORSE AS RI \
ON AR.ID_RISORSA=RI.ID_RISORSA \
#WHERECONDITION# \
