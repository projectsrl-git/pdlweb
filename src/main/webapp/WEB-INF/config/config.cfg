DS.DataSetDipendenzePDL.Class=net.project.dataset.DBDataSet
DS.DataSetDipendenzePDL.Row=net.projectsrl.db.PjDBRow
DS.DataSetDipendenzePDL.Query=\
SELECT \
	NP.ID_DIPENDENZE_PDL \
	,NP.ID_PDL \
	,NP.ID_DIPENDENZA \
FROM DIPENDENZE_PDL AS NP \
INNER JOIN PDL AS PR \
ON NP.ID_PDL=PR.ID_PDL \
WHERE NP.ID_PDL = #ID_PDL# \
order by ID_PDL



DS.DataSetStoricoInterferenze.Class=net.project.dataset.DBDataSet
DS.DataSetStoricoInterferenze.Row=net.projectsrl.db.PjDBRow
DS.DataSetStoricoInterferenze.Query=\
select distinct uturno.id_utente,codice_turno,data_Fine_turno,ora_fine_turno \
,initcap(UT.nome::text)||' '||initcap(UT.cognome::text) as UTENTE \
,ua.id_azienda,ragsoc \
,ID_IMPIANTO,DESCR_IMPIANTO,codice_impianto \
from utente_turno as uturno \
left outer join utenti as ut on ut.id_utente=uturno.id_utente \
left outer join utenti_aziende as ua on uturno.id_utente=ua.id_utente \
left outer join V_SITIPDL as az on ua.id_azienda=az.id_azienda \
LEFT OUTER JOIN IMPIANTI AS IM ON UA.ID_AZIENDA=IM.ID_AZIENDA \
where data_fine_turno=to_char(now(),'yyyy/mm/dd') and ora_Fine_turno='#ORA_FINE_TURNO#' \
and ragsoc<>'' and filename_planimetria<>''



DS.DSStoricoInterferenze.Class=net.project.dataset.DBDataSet
DS.DSStoricoInterferenze.Row=net.projectsrl.db.PjDBRow
DS.DSStoricoInterferenze.Query=\
select si.* \
,initcap(UT.nome::text)||' '||initcap(UT.cognome::text) as UTENTE \
,ragsoc,descr_impianto,codice_impianto \
from storico_interferenze as si \
left outer join utenti as ut on si.id_utente=ut.id_utente \
left outer join aziende as az on si.id_azienda=az.id_azienda \
left outer join impianti as im on si.id_impianto=im.id_impianto \
#WHERECONDITION# AND si.ID_AZIENDA #WHERECONDITION_AZIENDE# \
order by data_stampa,ora_stampa,id_modulo,id_impianto,codice_turno \


DS.DSStatusReportPDL.Class=net.project.dataset.DBDataSet
DS.DSStatusReportPDL.Row=net.projectsrl.db.PjDBRow
DS.DSStatusReportPDL.Query=\
select id_azienda,ragsoc \
, coalesce(sum(CASE WHEN stato = 'OPE' THEN parziale END),0) AS aperto \
, coalesce(sum(CASE WHEN stato = 'EXP' THEN parziale END),0) AS scaduto \
, coalesce(sum(CASE WHEN stato = 'CLO' THEN parziale END),0) AS chiuso \
, coalesce(sum(parziale)) AS totale \
from ( \
select id_azienda,ragsoc,stato,count(*) as parziale from v_pdl #WHERECONDITION# group by id_azienda,stato,ragsoc order by ragsoc \
) as t1 \
group by id_azienda,ragsoc




