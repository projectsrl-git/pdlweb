DS.DSPDLRichieste.Class=net.project.dataset.DBDataSet
DS.DSPDLRichieste.Row=project.db.PjDBRow
DS.DSPDLRichieste.Query=select REVISIONE, MOTIVAZIONE, \
ID_PDL,STATO,NR_PDL,LISTA_NR_PDL,LISTA_ID_PDL,DT_PDL,DESCR_STATO,DESCR_IMPIANTO,DESCR_AREA,DESCR_EQUIPMENT,DESCRIZIONE_LAVORO,NOMINATIVO_RICHIEDENTE,RESPONSABILE_CENTRALE_DELEGATO,IMPRESA_TESTO,NOME_COGNOME_PREPOSTO_IMPRESA,NOME_COGNOME_PREPOSTO_IMPRESA_2,FLG_PERSONALE_INTERNO,NOME_COGNOME_DELEGATO_LAVORI_AL,NOME_COGNOME_DELEGATO_LAVORI_AL_2,ODL,MOTIVO_SOSPENSIONE,MOTIVO_SCADENZA,STATO_FERMATA,VERIFICATI_PREVENTIVI,processato,cancellato,UTENTE_ULTIMA_ATTIVAZIONE,DATA_ULTIMA_ATTIVAZIONE,ORA_UTLIMA_ATTIVAZIONE,UTENTE_PRIMA_ATTIVAZIONE,DT_PRIMA_ATTIVAZIONE \
,case when lista_id_pdl<>verificati_preventivi then true else false end as processato_preventivo_situazione_cambiata \
, case when lista_id_pdl<>verificati_preventivi then '' else CASE WHEN UTENTE_VERIFICA<>'' THEN UTENTE_VERIFICA ELSE CASE WHEN UTENTE_MODIFICA<>'' THEN UTENTE_MODIFICA ELSE UTENTE_INSERIMENTO END end END as UTENTE_VERIFICA_FINALE \
, case when lista_id_pdl<>verificati_preventivi then '' else CASE WHEN DATA_VERIFICA<>'' THEN DATA_VERIFICA ELSE CASE WHEN DATA_MODIFICA<>'' THEN DATA_MODIFICA ELSE DATA_MODIFICA end END END as DATA_VERIFICA_FINALE \
, case when lista_id_pdl<>verificati_preventivi then '' else CASE WHEN ORA_VERIFICA<>'' THEN ORA_VERIFICA ELSE CASE WHEN ORA_MODIFICA<>'' THEN ORA_MODIFICA ELSE ORA_MODIFICA end END END as ORA_VERIFICA_FINALE \
, case when lista_id_pdl<>verificati_preventivi then '' else RISP_VERIFICA end as RISP_VERIFICA_FINALE \
from ( \
SELECT * \
,case when (stato<>'CLO' and stato<>'EXP') then (SELECT string_agg(nr_pdl||' '||pa.descrizione,',') FROM PDL as vpdl left outer join parametri as pa on codice=vpdl.stato and dominio='SPL' WHERE vpdl.stato in ('WAI') and vpdl.id_area=pdl.id_area and vpdl.id_pdl<>pdl.id_pdl and vpdl.impresa_testo<>pdl.impresa_testo) end AS lista_nr_pdl \
,case when (stato<>'CLO' and stato<>'EXP') then (SELECT array_agg(id_pdl order by id_pdl) FROM PDL as vpdl WHERE vpdl.stato in ('WAI') and vpdl.id_area=pdl.id_area and vpdl.id_pdl<>pdl.id_pdl and vpdl.impresa_testo<>pdl.impresa_testo) end AS lista_id_pdl \
,(SELECT array_agg(ID_DIPENDENZA order by id_dipendenza) FROM V_DIPENDENZE_PDL as dp WHERE pdl.id_pdl=dp.id_pdl) AS verificati_preventivi \
,(SELECT string_agg(dp.nr_pdl_dipendenza,', ') FROM V_DIPENDENZE_PDL as dp WHERE pdl.id_pdl=dp.id_pdl)::varchar AS nr_pdl_verificati_preventivi \
,case when (SELECT count(id_pdl) FROM PDL as vpdl WHERE vpdl.stato in ('WAI') and vpdl.id_area=pdl.id_area and vpdl.id_pdl<>pdl.id_pdl and vpdl.impresa_testo<>pdl.impresa_testo and vpdl.id_pdl not in (select id_pdl from limod70_dettagli))=0 then true else \
false \
end AS processato \
FROM V_PDL1 as pdl left outer join parametri on codice=stato and dominio='SPL' #WHERECONDITION# AND ID_AZIENDA #WHERECONDITION_AZIENDE# ORDER BY pdl.DT_PDL DESC, pdl.NR_PDL DESC) as tab




