DS.DataSetNewsHomepage.Class=net.project.dataset.DBDataSet
DS.DataSetNewsHomepage.Row=project.db.PjDBRow
DS.DataSetNewsHomepage.Query=SELECT ROW_NUMBER() OVER (ORDER BY ne.id_news desc) AS ordine,ne.ID_NEWS, ICONA, TITOLO, DESCRIZIONE, DT_VDAL, DT_VAL FROM NEWS as ne \
left outer join news_aziende as na on na.id_news=ne.ID_NEWS LEFT OUTER JOIN AZIENDE ON AZIENDE.ID_AZIENDA = na.id_news_azienda \
WHERE CONVERT(DATETIME,(RTRIM(CAST(YEAR(GETDATE()) AS CHAR))+'/'+REPLICATE('0', 2 - LEN(RTRIM(CAST(MONTH(GETDATE()) AS CHAR))))+RTRIM(CAST(MONTH(GETDATE()) AS CHAR))+'/'+REPLICATE('0', 2 - LEN(RTRIM(CAST(DAY(GETDATE()) AS CHAR))))+RTRIM(CAST(DAY(GETDATE()) AS CHAR))),111) BETWEEN CONVERT(DATETIME,DT_VDAL, 111) AND CONVERT(DATETIME,DT_VAL, 111) \
ORDER BY DT_VDAL DESC,DT_VAL DESC

