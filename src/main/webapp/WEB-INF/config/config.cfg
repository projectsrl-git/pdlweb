DS.DSNewsMail.Query=\
select distinct email from utenti_profili as up \
left outer join utenti as ut on up.id_utente=ut.id_utente \
left outer join utenti_aziende as az on up.id_utente=az.id_utente \
left outer join aziende as az1 on az.id_azienda=az1.id_azienda \
where up.id_profilo in (#LISTA_PROFILI#) \
and az.id_azienda in (#LISTA_AZIENDE#) \
order by email


