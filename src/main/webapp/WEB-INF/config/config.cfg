DS.DSGraficoTortaHome.Class=net.project.dataset.DBDataSet
DS.DSGraficoTortaHome.Row=project.db.PjDBRow
DS.DSGraficoTortaHome.Query=\
select sum (tot_ope) as tot_ope, sum(tot_act) as tot_act, sum(tot_sus) as tot_sus, sum(tot_clo) as tot_clo from( \
select \
     dt_giorno \
     ,dt_giorno_ita \
     ,coalesce(ope.totale,0) as tot_ope \
     ,coalesce(act.totale,0) as tot_act \
     ,coalesce(sus.totale,0) as tot_sus \
     ,coalesce(clo.totale,0) as tot_clo \
     ,(select count(*) as tot from pdl \
         where not cancellato and d30.dt_giorno between DT_PDL and case \
                                                         when \
coalesce(DT_CHIUSURA,'9999/99/99') > coalesce(DT_SOSPENSIONE,'9999/99/99') \
                                                         then \
coalesce(DT_SOSPENSIONE,'9999/99/99') \
                                                         else \
coalesce(DT_CHIUSURA,'9999/99/99') end \
             and cast(d30.dt_giorno as date) = cast(dt_pdl as date) \
+interval '15 day' \
             and id_azienda #WHERECONDITION_AZIENDE#  ) as tot_exp \
     ,(select count(*) as tot from pdl as actual_act \
         where not cancellato and d30.dt_giorno between DT_ATTIVAZIONE and case \
                                                         when \
coalesce(DT_CHIUSURA,'9999/99/99') > coalesce(DT_SOSPENSIONE,'9999/99/99') \
                                                         then \
coalesce(DT_SOSPENSIONE,'9999/99/99') \
                                                         else \
coalesce(DT_CHIUSURA,'9999/99/99') end \
             and cast(d30.dt_giorno as date) < cast(dt_pdl as date) \
+interval '15 day' \
             and id_azienda #WHERECONDITION_AZIENDE#  ) as tot_actual_act from ( select \
     to_char(dt_serie_ultimo_mese, 'YYYY/mm/DD') as dt_giorno \
     ,to_char(dt_serie_ultimo_mese, 'DD-mm-YYYY') as dt_giorno_ita from ( select generate_series(current_date-interval '15 day',current_date,  '1 \
day'::interval) as dt_serie_ultimo_mese \
) as d30_0 ) as d30 \
left outer join ( \
     select \
         dt_pdl \
         ,count(*) as totale \
     from pdl \
     where not cancellato and id_azienda #WHERECONDITION_AZIENDE# \
     group by dt_pdl) as ope \
on ope.dt_pdl = d30.dt_giorno \
left outer join ( \
     select \
         DT_ATTIVAZIONE \
         ,count(*) as totale \
     from pdl \
     where not cancellato and id_azienda #WHERECONDITION_AZIENDE# \
     group by DT_ATTIVAZIONE) as act \
on act.DT_ATTIVAZIONE = d30.dt_giorno \
left outer join ( \
     select \
         DT_SOSPENSIONE \
         ,count(*) as totale \
     from pdl \
     where not cancellato and id_azienda #WHERECONDITION_AZIENDE# \
     group by DT_SOSPENSIONE) as sus \
on sus.DT_SOSPENSIONE = d30.dt_giorno \
left outer join ( \
     select \
         DT_CHIUSURA \
         ,count(*) as totale \
     from pdl \
     where not cancellato and id_azienda #WHERECONDITION_AZIENDE# \
     group by DT_CHIUSURA) as clo \
on clo.DT_CHIUSURA = d30.dt_giorno \
) as tab



