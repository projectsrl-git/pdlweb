DS.DSMenu.Class=net.project.dataset.DBDataSet
DS.DSMenu.Row=project.db.PjDBRowPDF
DS.DSMenu.Query=\
SELECT MT.ID_MENU \
	,MT.ID_MENU_SUP \
	,LI.CODICE_ISO AS ISO_LANGUAGE \
	,ML.DESCRIZIONE AS LABEL \
	,MT.LINK \
	,MT.ALIAS \
	,MT.ICON \
	,MT.PATH \
	,MT.PATH_DESCRI \
	,MT.LINK_CHAIN \
	,MT.DEPTH AS ITEM_LEVEL \
	,COALESCE(CAST (CH.NR_CHILDREN  AS  integer),0) AS NR_CHILDREN \
FROM V_MENU_TREE AS MT \
LEFT OUTER JOIN (SELECT ID_MENU_SUP AS ID_MENU,COUNT(*) AS NR_CHILDREN FROM V_MENU_TREE GROUP BY ID_MENU_SUP) AS CH \
ON CH.ID_MENU= MT.ID_MENU \
INNER JOIN MENU_PROFILI AS MP \
ON MT.ID_MENU=MP.ID_MENU \
INNER JOIN PROFILI AS PR \
ON MP.ID_PROFILO = PR.ID_PROFILO \
INNER JOIN MENU_LINGUE AS ML \
ON MT.ID_MENU=ML.ID_MENU \
INNER JOIN LINGUE_ISO AS LI \
ON LI.ID_LINGUE_ISO=ML.ID_LINGUE_ISO AND MT.CODICE_ISO = LI.CODICE_ISO \
INNER JOIN UTENTI_PROFILI AS UP \
ON MP.ID_PROFILO = UP.ID_PROFILO \
INNER JOIN UTENTI AS US \
ON US.ID_UTENTE = UP.ID_UTENTE \
INNER JOIN UTENTI_LINGUE AS UL \
ON US.ID_UTENTE =UL.ID_UTENTE \
WHERE LOWER(US.USERNAME) = LOWER('#USERNAME#') and  LI.CODICE_ISO='#CURRENT_SELECTED_ISO_LANGUAGE#' \
GROUP BY \
	MT.ID_MENU\
	,MT.ID_MENU_SUP\
	,LI.CODICE_ISO\
	,ML.DESCRIZIONE\
	,MT.LINK\
	,MT.ALIAS \
	,MT.ICON \
	,MT.PATH\
	,MT.PATH_DESCRI\
	,MT.LINK_CHAIN \
	,MT.DEPTH\
	,CH.NR_CHILDREN \
ORDER BY \
	MT.PATH\
	,LI.CODICE_ISO

