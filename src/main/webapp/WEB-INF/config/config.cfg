DS.DSCedolini.Class=net.project.dataset.DBDataSet
DS.DSCedolini.Row=project.db.PjDBRow
DS.DSCedolini.Query=\
SELECT \
	COALESCE(ri.COGNOME+' '+ri.NOME, \
		CASE \
			WHEN DIPENDENTE ='RIEGEN00000' THEN 'RIEPILOGO GENERALE' \
			WHEN DIPENDENTE ='RIEMEN00000' THEN 'RIEPILOGO MENSILE' END) AS NOMINATIVO_ROVESCIO \
	, EF.* \
	,'cedolini/'+EF.AZIENDA+'/'+DIPENDENTE+'/'+DIPENDENTE+'_'+ANNO+'.pdf' AS MRIEPILOGO \
	, dipendente as NOMINATIVO \
	, COALESCE(RAGSOC,'') AS RAGSOC \
FROM ELENCO_FILE AS EF \
left outer join RISORSE as ri \
on ri.CODICE_FISCALE=ef.CODICE_FISCALE \
LEFT OUTER JOIN AZIENDE AS AZ \
ON AZ.CODICE = EF.AZIENDA \
left outer join UTENTI_RISORSE as ur \
on ur.ID_RISORSA=ri.ID_RISORSA \
#WHERECONDITION# AND AZ.ID_AZIENDA #WHERECONDITION_AZIENDE# \
AND TIPOLOGIA ='C' \
AND (ID_UTENTE=#ID_UTENTE# #WHERECONDITION_RISORSE_CEDOLINI#) ORDER BY ANNO DESC,ri.COGNOME, ri.NOME



