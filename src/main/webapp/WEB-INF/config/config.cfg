DS.DSProgressivoPDL.Class=net.project.dataset.DBDataSet
DS.DSProgressivoPDL.Row=project.db.PjDBRow
DS.DSProgressivoPDL.Query=\
SELECT substring(NR_PDL,1,4) AS ULTIMO \
	,substring(NR_PDL,6,2) as anno \
	,to_char(CURRENT_TIMESTAMP,'yy') as anno_corrente \
FROM PDL WHERE ID_AZIENDA=#ID_AZIENDA# \
and STATO<>'WAI' \
and  substring(NR_PDL,6,2) = to_char(CURRENT_TIMESTAMP,'yy') \
ORDER BY substring(NR_PDL,6,2) DESC, substring(NR_PDL,1,4) DESC; 


DS.DSProgressivoRichiestaPDL.Class=net.project.dataset.DBDataSet
DS.DSProgressivoRichiestaPDL.Row=project.db.PjDBRow
DS.DSProgressivoRichiestaPDL.Query=\
SELECT substring(NR_PDL,3,4) AS ULTIMO \
	,substring(NR_PDL,8,2) as anno \
	,to_char(CURRENT_TIMESTAMP,'yy') as anno_corrente \
FROM PDL WHERE ID_AZIENDA=#ID_AZIENDA# \
and STATO='WAI' \
and substring(NR_PDL,1,2) = 'T-' \
and  substring(NR_PDL,8,2) = to_char(CURRENT_TIMESTAMP,'yy') \
ORDER BY substring(NR_PDL,8,2) DESC, substring(NR_PDL,3,4) DESC;


DS.DSPDL.Class=net.project.dataset.DBDataSet
DS.DSPDL.Row=project.db.PjDBRow
DS.DSPDL.Query=select *,case when lista_id_pdl<>verificati_preventivi then true else false end as processato_preventivo_situazione_cambiata \
,CASE WHEN FLG_IN_QUOTA = true OR FLG_SCAVO = true OR FLG_V9_PDL_A_CALDO = true THEN true ELSE false END as FLG_PP_MOD_01 \
, case when lista_id_pdl<>verificati_preventivi then '' else CASE WHEN UTENTE_VERIFICA<>'' THEN UTENTE_VERIFICA ELSE CASE WHEN UTENTE_MODIFICA<>'' THEN UTENTE_MODIFICA ELSE UTENTE_INSERIMENTO END end END as UTENTE_VERIFICA_FINALE \
, case when lista_id_pdl<>verificati_preventivi then '' else CASE WHEN DATA_VERIFICA<>'' THEN DATA_VERIFICA ELSE CASE WHEN DATA_MODIFICA<>'' THEN DATA_MODIFICA ELSE DATA_MODIFICA end END END as DATA_VERIFICA_FINALE \
, case when lista_id_pdl<>verificati_preventivi then '' else CASE WHEN ORA_VERIFICA<>'' THEN ORA_VERIFICA ELSE CASE WHEN ORA_MODIFICA<>'' THEN ORA_MODIFICA ELSE ORA_MODIFICA end END END as ORA_VERIFICA_FINALE \
, case when lista_id_pdl<>verificati_preventivi then '' else RISP_VERIFICA end as RISP_VERIFICA_FINALE \
from ( \
SELECT * \
,case when (stato<>'CLO' and stato<>'EXP') then (SELECT string_agg(nr_pdl||' '||pa.descrizione,',') FROM PDL as vpdl left outer join parametri as pa on codice=vpdl.stato and dominio='SPL' WHERE vpdl.stato in ('OPE','ACT') and vpdl.id_area=pdl.id_area and vpdl.id_pdl<>pdl.id_pdl and vpdl.impresa_testo<>pdl.impresa_testo) end AS lista_nr_pdl \
,case when (stato<>'CLO' and stato<>'EXP') then (SELECT array_agg(id_pdl order by id_pdl) FROM PDL as vpdl WHERE vpdl.stato in ('OPE','ACT') and vpdl.id_area=pdl.id_area and vpdl.id_pdl<>pdl.id_pdl and vpdl.impresa_testo<>pdl.impresa_testo) end AS lista_id_pdl \
,(SELECT array_agg(ID_DIPENDENZA order by id_dipendenza) FROM V_DIPENDENZE_PDL as dp WHERE pdl.id_pdl=dp.id_pdl) AS verificati_preventivi \
,(SELECT string_agg(dp.nr_pdl_dipendenza,', ') FROM V_DIPENDENZE_PDL as dp WHERE pdl.id_pdl=dp.id_pdl)::varchar AS nr_pdl_verificati_preventivi \
,case when (SELECT count(id_pdl) FROM PDL as vpdl WHERE vpdl.stato in ('OPE','ACT') and vpdl.id_area=pdl.id_area and vpdl.id_pdl<>pdl.id_pdl and vpdl.impresa_testo<>pdl.impresa_testo and vpdl.id_pdl not in (select id_pdl from limod70_dettagli))=0 then true else \
false \
end AS processato \
FROM V_PDL1 as pdl left outer join parametri on codice=stato and dominio='SPL' #WHERECONDITION# AND ID_AZIENDA #WHERECONDITION_AZIENDE# ORDER BY pdl.DT_PDL DESC, pdl.NR_PDL DESC) as tab


DS.DSPDLRicerca.Class=net.project.dataset.DBDataSet
DS.DSPDLRicerca.Row=project.db.PjDBRow
DS.DSPDLRicerca.Query=select REVISIONE, MOTIVAZIONE, \
ID_PDL,STATO,NR_PDL,LISTA_NR_PDL,LISTA_ID_PDL,DT_PDL,DESCR_STATO,DESCR_IMPIANTO,DESCR_AREA,DESCR_EQUIPMENT,DESCRIZIONE_LAVORO,RESPONSABILE_CENTRALE_DELEGATO,IMPRESA_TESTO,NOME_COGNOME_PREPOSTO_IMPRESA,NOME_COGNOME_PREPOSTO_IMPRESA_2,FLG_PERSONALE_INTERNO,NOME_COGNOME_DELEGATO_LAVORI_AL,NOME_COGNOME_DELEGATO_LAVORI_AL_2,ODL,MOTIVO_SOSPENSIONE,MOTIVO_SCADENZA,STATO_FERMATA,VERIFICATI_PREVENTIVI,processato,cancellato,UTENTE_ULTIMA_ATTIVAZIONE,DATA_ULTIMA_ATTIVAZIONE,ORA_UTLIMA_ATTIVAZIONE,UTENTE_PRIMA_ATTIVAZIONE,DT_PRIMA_ATTIVAZIONE \
,case when lista_id_pdl<>verificati_preventivi then true else false end as processato_preventivo_situazione_cambiata \
, case when lista_id_pdl<>verificati_preventivi then '' else CASE WHEN UTENTE_VERIFICA<>'' THEN UTENTE_VERIFICA ELSE CASE WHEN UTENTE_MODIFICA<>'' THEN UTENTE_MODIFICA ELSE UTENTE_INSERIMENTO END end END as UTENTE_VERIFICA_FINALE \
, case when lista_id_pdl<>verificati_preventivi then '' else CASE WHEN DATA_VERIFICA<>'' THEN DATA_VERIFICA ELSE CASE WHEN DATA_MODIFICA<>'' THEN DATA_MODIFICA ELSE DATA_MODIFICA end END END as DATA_VERIFICA_FINALE \
, case when lista_id_pdl<>verificati_preventivi then '' else CASE WHEN ORA_VERIFICA<>'' THEN ORA_VERIFICA ELSE CASE WHEN ORA_MODIFICA<>'' THEN ORA_MODIFICA ELSE ORA_MODIFICA end END END as ORA_VERIFICA_FINALE \
, case when lista_id_pdl<>verificati_preventivi then '' else RISP_VERIFICA end as RISP_VERIFICA_FINALE \
from ( \
SELECT * \
,case when (stato<>'CLO' and stato<>'EXP') then (SELECT string_agg(nr_pdl||' '||pa.descrizione,',') FROM PDL as vpdl left outer join parametri as pa on codice=vpdl.stato and dominio='SPL' WHERE vpdl.stato in ('OPE','ACT') and vpdl.id_area=pdl.id_area and vpdl.id_pdl<>pdl.id_pdl and vpdl.impresa_testo<>pdl.impresa_testo) end AS lista_nr_pdl \
,case when (stato<>'CLO' and stato<>'EXP') then (SELECT array_agg(id_pdl order by id_pdl) FROM PDL as vpdl WHERE vpdl.stato in ('OPE','ACT') and vpdl.id_area=pdl.id_area and vpdl.id_pdl<>pdl.id_pdl and vpdl.impresa_testo<>pdl.impresa_testo) end AS lista_id_pdl \
,(SELECT array_agg(ID_DIPENDENZA order by id_dipendenza) FROM V_DIPENDENZE_PDL as dp WHERE pdl.id_pdl=dp.id_pdl) AS verificati_preventivi \
,(SELECT string_agg(dp.nr_pdl_dipendenza,', ') FROM V_DIPENDENZE_PDL as dp WHERE pdl.id_pdl=dp.id_pdl)::varchar AS nr_pdl_verificati_preventivi \
,case when (SELECT count(id_pdl) FROM PDL as vpdl WHERE vpdl.stato in ('OPE','ACT') and vpdl.id_area=pdl.id_area and vpdl.id_pdl<>pdl.id_pdl and vpdl.impresa_testo<>pdl.impresa_testo and vpdl.id_pdl not in (select id_pdl from limod70_dettagli))=0 then true else \
false \
end AS processato \
FROM V_PDL1 as pdl left outer join parametri on codice=stato and dominio='SPL' #WHERECONDITION# AND ID_AZIENDA #WHERECONDITION_AZIENDE# ORDER BY pdl.DT_PDL DESC, pdl.NR_PDL DESC) as tab


DS.DSPDLTemp.Class=net.project.dataset.DBDataSet
DS.DSPDLTemp.Row=project.db.PjDBRow
DS.DSPDLTemp.Query=SELECT *, nominativo_richiedente::varchar(150) as v9_nominativo_richiedente,\
CASE WHEN FLG_PERSONALE_ESTERNO THEN NOME_COGNOME_DELEGATO_LAVORI_AL ELSE '' END AS NC_DL_AL_1, \
CASE WHEN FLG_PERSONALE_ESTERNO THEN NOME_COGNOME_DELEGATO_LAVORI_AL_2 ELSE '' END AS NC_DL_AL_2, \
CASE WHEN FLG_PERSONALE_INTERNO THEN NOME_COGNOME_DELEGATO_LAVORI_AL ELSE '' END AS NC_DL_AL_P1, \
CASE WHEN FLG_PERSONALE_INTERNO THEN NOME_COGNOME_DELEGATO_LAVORI_AL_2 ELSE '' END AS NC_DL_AL_P2 \
,(SELECT string_agg(nr_pdl||' '||descrizione,',') FROM PDL as vpdl WHERE vpdl.stato in ('OPE','ACT') and vpdl.id_area=pdl.id_area and vpdl.id_pdl<>pdl.id_pdl) AS lista_nr_pdl \
,(SELECT array_agg(id_pdl) FROM PDL as vpdl WHERE vpdl.stato in ('OPE','ACT') and vpdl.id_area=pdl.id_area and vpdl.id_pdl<>pdl.id_pdl) AS lista_id_pdl \
FROM V_PDL1 as pdl left outer join parametri on codice=stato and dominio='SPL' #WHERECONDITION# AND ID_AZIENDA #WHERECONDITION_AZIENDE# ORDER BY pdl.DT_PDL DESC, pdl.NR_PDL DESC


