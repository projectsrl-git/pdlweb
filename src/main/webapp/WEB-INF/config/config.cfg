DS.DSRisorse.Class=net.project.dataset.DBDataSet
DS.DSRisorse.Row=net.projectsrl.db.PjDBRow
DS.DSRisorse.Query=\
SELECT \
	RI.*\
	,RI.NOME + ' ' + RI.COGNOME AS NOMINATIVO \
	,( SELECT STUFF(( \
		SELECT ',' + RTRIM(CAST(RA.ID_AZIENDA AS NVARCHAR(MAX)))\
		FROM RISORSE_AZIENDA AS RA \
		INNER JOIN AZIENDE AS AZ \
		ON RA.ID_AZIENDA=AZ.ID_AZIENDA \
		WHERE RA.ID_RISORSA=RI.ID_RISORSA \
		ORDER BY AZ.RAGSOC \
		FOR XML PATH(''), TYPE).value('.', 'NVARCHAR(MAX)'), 1, 1, '')) AS AZIENDE_RISORSA \
	,( SELECT STUFF(( \
		SELECT ', ' + AZ.RAGSOC \
		FROM RISORSE_AZIENDA AS RA \
		INNER JOIN AZIENDE AS AZ \
		ON RA.ID_AZIENDA=AZ.ID_AZIENDA \
		WHERE RA.ID_RISORSA=RI.ID_RISORSA \
		ORDER BY AZ.RAGSOC \
		FOR XML PATH(''), TYPE).value('.', 'NVARCHAR(MAX)'), 1, 1, '')) AS RAGSOC_AZIENDE_RISORSA \
	,RA.DT_INIZIO_RAPPORTO \
	,RA.DT_FINE_RAPPORTO \
	,RA.FL_IN_CORSO \
	,AZ.RAGSOC \
FROM RISORSE AS RI \
INNER JOIN (SELECT	ID_RISORSA \
					,ID_AZIENDA \
					,DT_INIZIO_RAPPORTO \
					,DT_FINE_RAPPORTO \
					,FL_IN_CORSO \
				FROM RISORSE_AZIENDA AS T1 \
				WHERE FL_ULTIMO_RAPPORTO=1) AS RA \
ON RI.ID_RISORSA=RA.ID_RISORSA \
INNER JOIN AZIENDE AS AZ \
ON AZ.ID_AZIENDA=RA.ID_AZIENDA \
WHERE RA.ID_AZIENDA #WHERECONDITION_AZIENDE# \
ORDER BY RAGSOC,RI.COGNOME,RI.NOME

