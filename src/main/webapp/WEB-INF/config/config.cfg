DS.DSContributor.Class=net.project.dataset.DBDataSet
DS.DSContributor.Row=project.db.PjDBRow
DS.DSContributor.Query=\
SELECT DISTINCT UT.ID_UTENTE,NOME||' '||COGNOME AS NOME_COGNOME \
FROM UTENTI AS UT \
INNER JOIN UTENTI_PROFILI AS UP ON UT.ID_UTENTE=UP.ID_UTENTE \
INNER JOIN PROFILI AS PR ON PR.ID_PROFILO=UP.ID_PROFILO \
INNER JOIN UTENTI_AZIENDE AS UA ON UT.ID_UTENTE= UA.ID_UTENTE \
WHERE CODICE='CON' AND ID_AZIENDA #WHERECONDITION_AZIENDE# \
ORDER BY NOME_COGNOME

DS.DSResponsabiliAzioni.Class=net.project.dataset.DBDataSet
DS.DSResponsabiliAzioni.Row=project.db.PjDBRow
DS.DSResponsabiliAzioni.Query=\
SELECT \
	DISTINCT \
	UT.ID_UTENTE \
	,NOME||' '||COGNOME AS  NOME_COGNOME \
	, COGNOME,NOME \
FROM UTENTI AS UT \
INNER JOIN UTENTI_PROFILI AS UP ON UT.ID_UTENTE = UP.ID_UTENTE \
INNER JOIN UTENTI_AZIENDE AS UA ON UT.ID_UTENTE = UA.ID_UTENTE \
INNER JOIN AZIENDE AS AZ ON UA.ID_AZIENDA=AZ.ID_AZIENDA \
INNER JOIN PROFILI AS PR ON UP.ID_PROFILO=PR.ID_PROFILO \
WHERE AZ.TIPO_AZIENDA LIKE '%HSE%' AND PR.CODICE IN ('APP','CON') AND UA.ID_AZIENDA #WHERECONDITION_AZIENDE# \
ORDER BY COGNOME,NOME


