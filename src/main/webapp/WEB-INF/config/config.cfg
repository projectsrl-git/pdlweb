DS.DSInterferenzePDL.Class=net.project.dataset.DBDataSet
DS.DSInterferenzePDL.Row=project.db.PjDBRow
DS.DSInterferenzePDL.Query=SELECT case \
WHEN (stato='Da processare' and fl_tutto_impianto_simulato=true and (colore='' or colore is null) \
and \
(select distinct colore from V_COLORE_AREA where id_area in (select id_area from area_lavoro where fl_tutto_impianto=true and id_impianto=#ID_IMPIANTO#))='darkorange') \
then 'darkorange' else colore \
end as colore ,descr_area,id_azienda,id_impianto,id_area,id_pdl,nr_pdl,descrizione_lavoro,dt_attivazione,nome_cognome_preposto_impresa,nome_impresa,email,fl_tutto_impianto,rect_x,rect_y,rect_h,rect_w, \
testo_x,testo_y,a_capo,rect_x_stampa,rect_y_stampa,rect_h_stampa,rect_w_stampa,testo_x_stampa,testo_y_stampa,a_capo_stampa,flg_possibile_interferenza,stato,fl_tutto_impianto_simulato,ID_PDL_CORRETTO,cancellato \
from ( \
select (SELECT DISTINCT ON (id_area) \
colore \
FROM   V_INTERFERENZE_PDL_FINAL where id_area=tab.id_area \
ORDER  BY id_area,colore desc) as colore \
,descr_area,id_azienda,id_impianto,id_area,id_pdl,nr_pdl,descrizione_lavoro,dt_attivazione,nome_cognome_preposto_impresa,nome_impresa,email,fl_tutto_impianto,rect_x,rect_y,rect_h,rect_w, \
testo_x,testo_y,a_capo,rect_x_stampa,rect_y_stampa,rect_h_stampa,rect_w_stampa,testo_x_stampa,testo_y_stampa,a_capo_stampa,flg_possibile_interferenza,stato,fl_tutto_impianto_simulato,ID_PDL_CORRETTO,cancellato \
from ( \
SELECT colore \
,descr_area,id_azienda,id_impianto,id_area,id_pdl,nr_pdl,descrizione_lavoro,dt_attivazione,nome_cognome_preposto_impresa,nome_impresa,email,fl_tutto_impianto,rect_x,rect_y,rect_h,rect_w, \
testo_x,testo_y,a_capo,rect_x_stampa,rect_y_stampa,rect_h_stampa,rect_w_stampa,testo_x_stampa,testo_y_stampa,a_capo_stampa,flg_possibile_interferenza,stato,fl_tutto_impianto_simulato,ID_PDL_CORRETTO,cancellato \
from V_INTERFERENZE_PDL_FINAL as vfinal) as tab ) as tab1 where ID_IMPIANTO=#ID_IMPIANTO# and not cancellato ORDER BY ID_AREA,nr_pdl




