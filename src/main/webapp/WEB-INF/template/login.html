<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

	<script src="js/jquery-2.1.1.js"></script>
    <script src="js/bootstrap.min.js"></script>

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="font-awesome/css/font-awesome.css" rel="stylesheet">

    <link href="css/animate.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    
    <script type="text/javascript">
		$(function(){
			$("#Login").validate({
				submitHandler: function(form) {
					// do other things for a valid form
					form.submit();
				}
			});
		});
    </script> 
    

</head>

<body class="gray-bg">

    <div class="middle-box text-center loginscreen animated fadeInDown">
        <div>
            <div>

                <h1 class="logo-name" style="margin-left:-10px;"> <img src="img/airliquide-logo.png" /></h1>

            </div>
            <!--<p>Login in. To see it in action.</p>-->
            <form action="astro" method="post" id="Login">
            	<input type="hidden" id="FUNCTIONID" name="FUNCTIONID" value="Home" />
				<#if SESSION_TOKEN?exists><input type="hidden" id="SESSION_TOKEN" name="SESSION_TOKEN" value="${SESSION_TOKEN}"></#if>
				<p><center><#if ERROR_MESSAGE?exists>${ERROR_MESSAGE}</#if></center></p>					
					
                <div class="form-group">
                    <input class="form-control" name="USERNAME" id="USERNAME" placeholder="Username" required="">
                </div>
                <div class="form-group">
                    <input type="password" class="form-control" name="PASSWORD" id="PASSWORD" placeholder="Password" required="">
                </div>
                <button type="submit" class="btn btn-primary block full-width m-b">Login</button>
</form>
                <a href="astro?FUNCTIONID=ResetPassword"><small>Password dimenticata?</small></a>
            
            <p> <small>Vers. 1.0.0 &copy; Air Liquide S.p.A. 2017 || Engineered by F. Miduri || Powered by Project srl || All Rights Reserved</small></p>
        </div>
    </div>


</body>

</html>
